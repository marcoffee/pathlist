name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # stamps the tag (without the "v" prefix) into the script
      - run: |
          sed -i "s/^__version__: Final = \"0\.0\.0-dev\"$/__version__: Final = \"${GITHUB_REF_NAME#v}\"/" pathlist

      # ensure that the stamp worked
      - run: test "$(python3 pathlist --dump-version)" = "${GITHUB_REF_NAME#v}"

      - run: gh release create "${GITHUB_REF_NAME}" pathlist --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
