name: test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # "3" is the newest stable release, so a new minor shows up here before being listed
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3"]

    runs-on: ubuntu-latest

    # the official images keep every python version, while the runner images drop the old ones
    container:
      image: python:${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - run: python -m unittest discover -s tests -v

  coverage:
    runs-on: ubuntu-latest

    container:
      image: python:3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - run: python -m pip install --root-user-action=ignore -r tests/requirements.txt
      - run: python -m coverage run --branch --include=pathlist -m unittest discover -s tests
      - run: python -m coverage report -m --fail-under=100
