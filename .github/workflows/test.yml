name: test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    runs-on: ubuntu-latest

    # the official images keep every python version, while the runner images drop the old ones
    container:
      image: python:${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - run: python -m unittest discover -s tests -v

  coverage:
    runs-on: ubuntu-latest

    container:
      image: python:3

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - run: python -m pip install --root-user-action=ignore coverage==7.14.0
      - run: python -m coverage run --branch --include=pathlist -m unittest discover -s tests
      - run: python -m coverage report -m --fail-under=100
